plugins {
    id 'application'
    id 'jacoco'
    id 'org.openjfx.javafxplugin' version '0.1.0'
    id 'edu.sc.seis.launch4j' version '4.0.0'
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

javafx {
    version = '21.0.10'
    modules = ['javafx.controls', 'javafx.fxml']
}

application {
    mainClass = 'tetris.Main'
}

// Windows 실행기. Java 21 이상은 실행 PC에 설치되어 있다고 가정한다.
launch4j { // .\gradlew.bat createExe : 실행파일 실행 명령어. 터미널에 넣어서 실행
    mainClassName = 'tetris.Main'
    outfile = 'Tetris.exe'
    headerType = 'gui'
    jreMinVersion = '21'
    requires64Bit = true
    bundledJrePath = '%JAVA_HOME%;%PATH%'
    chdir = '.'
    jvmOptions = ['--module-path=lib', '--add-modules=javafx.controls,javafx.fxml']
    icon = "${projectDir}/packaging/tetris.ico"
}

tasks.named('run', JavaExec) {
    systemProperty 'tetris.profile', providers.gradleProperty('frameProfile').getOrElse('false')
}

tasks.register('prepareJavaFxRuntime', Sync) {
    dependsOn classes
    from configurations.runtimeClasspath
    into layout.buildDirectory.dir('javafx')
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.2'

    // JUnit 5 버전 충돌을 막기 위해 BOM(Bill of Materials) 적용
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher' // VS Code 실행기를 위해 필수
}

test {
    useJUnitPlatform()
    systemProperty 'file.encoding', 'UTF-8'
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
}
