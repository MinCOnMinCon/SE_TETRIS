plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

javafx {
    version = '21.0.10'
    modules = ['javafx.controls', 'javafx.fxml']
}

application {
    mainClass = 'tetris.Main'
}